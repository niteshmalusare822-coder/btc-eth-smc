<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BTC ETH SMC Dashboard</title>

<link rel="stylesheet" href="style.css?v=13">

<style>
  #viability {
    max-width: 900px;
    margin: 12px auto 0;
    color: #ddd;
  }
</style>
</head>

<body>

<header>
    <h1>BTC & ETH Futures Dashboard</h1>

    <div id="status">
        Connecting...
    </div>

    <div id="sentiment-box">
        Market Sentiment:
        <span id="sentiment-text">
            Loading...
        </span>
    </div>
</header>


<!-- =========================
     VIABILITY
     ========================= -->

<div id="viability"></div>


<!-- =========================
     COIN GRID
     ========================= -->

<div class="grid">

    <!-- BTC -->
    <div class="coin-card">
        <h2>BTC/USDT</h2>
        <div id="btc-content"></div>
    </div>


    <!-- ETH -->
    <div class="coin-card">
        <h2>ETH/USDT</h2>
        <div id="eth-content"></div>
    </div>


    <!-- SOL -->
    <div class="coin-card">
        <h2>SOL/USDT</h2>
        <div id="sol-content"></div>
    </div>


    <!-- XRP -->
    <div class="coin-card">
        <h2>XRP/USDT</h2>
        <div id="xrp-content"></div>
    </div>


    <!-- AVAX -->
    <div class="coin-card">
        <h2>AVAX/USDT</h2>
        <div id="avax-content"></div>
    </div>


    <!-- LINK -->
    <div class="coin-card">
        <h2>LINK/USDT</h2>
        <div id="link-content"></div>
    </div>


    <!-- DOGE -->
    <div class="coin-card">
        <h2>DOGE/USDT</h2>
        <div id="doge-content"></div>
    </div>


    <!-- ADA -->
    <div class="coin-card">
        <h2>ADA/USDT</h2>
        <div id="ada-content"></div>
    </div>


    <!-- DEXE -->
    <div class="coin-card">
        <h2>
            DEXE/USDT
            <span class="unvalidated">unvalidated</span>
        </h2>

        <div id="dexe-content"></div>
    </div>


    <!-- BANK -->
    <div class="coin-card">
        <h2>
            BANK/USDT
            <span class="unvalidated">unvalidated</span>
        </h2>

        <div id="bank-content"></div>
    </div>


    <!-- BNB -->
    <div class="coin-card">
        <h2>BNB/USDT</h2>
        <div id="bnb-content"></div>
    </div>


    <!-- SUI -->
    <div class="coin-card">
        <h2>SUI/USDT</h2>
        <div id="sui-content"></div>
    </div>


    <!-- HBAR -->
    <div class="coin-card">
        <h2>HBAR/USDT</h2>
        <div id="hbar-content"></div>
    </div>


    <!-- LTC -->
    <div class="coin-card">
        <h2>LTC/USDT</h2>
        <div id="ltc-content"></div>
    </div>


    <!-- BCH -->
    <div class="coin-card">
        <h2>BCH/USDT</h2>
        <div id="bch-content"></div>
    </div>


    <!-- DOT -->
    <div class="coin-card">
        <h2>DOT/USDT</h2>
        <div id="dot-content"></div>
    </div>


    <!-- PEPE -->
    <div class="coin-card">
        <h2>1000PEPE/USDT</h2>
        <div id="1000pepe-content"></div>
    </div>

</div>


<!-- =========================
     TRADINGVIEW
     ========================= -->

<iframe
    src="https://s.tradingview.com/widgetembed/?symbol=BINANCE:BTCUSDT&interval=5&timezone=Asia%2FKolkata"
    class="chart"
    title="BTC/USDT TradingView Chart">
</iframe>


<!-- =========================
     JAVASCRIPT
     ========================= -->

<script src="script.js?v=13"></script>

</body>
</html>
