<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factor Lab — btc-eth-smc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#E9EBE6;--paper-2:#F2F3EF;--grid:#D3D7CE;--ink:#1B2420;--ink-soft:#5C6660;
--ink-faint:#8F9891;--measure:#1F4E79;--measure-soft:#1F4E7922;--null:#B9BFB4;
--reject:#8C4A32;--hair:#C6CBC0;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);
background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
background-size:100% 28px,28px 100%;background-position:0 -1px,-1px 0;
color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:32px 20px 96px}
.mast{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px}
.mast h1{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(28px,6vw,44px);letter-spacing:-.03em;margin:0}
.mast .sub{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-soft);margin-top:6px}
.conds{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--hair);border:1px solid var(--hair);margin-bottom:8px}
.cond{background:var(--paper-2);padding:9px 11px}
.cond dt{font-family:"IBM Plex Mono",monospace;font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-faint);margin:0 0 3px}
.cond dd{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;margin:0}
.cond.warn dd{color:var(--reject)}
.note{font-size:12.5px;color:var(--ink-soft);margin:0 0 26px}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--hair);border-bottom:1px solid var(--hair)}
label.ctl{font-family:"IBM Plex Mono",monospace;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);display:flex;align-items:center;gap:6px}
select,button{font-family:"IBM Plex Mono",monospace;font-size:13px;background:var(--paper-2);color:var(--ink);border:1px solid var(--hair);border-radius:0;padding:5px 8px}
button{cursor:pointer;font-weight:500}
button:hover{border-color:var(--ink)}
select:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--measure);outline-offset:1px}
.switch{display:flex;align-items:center;gap:6px;cursor:pointer}
.switch input{accent-color:var(--measure);width:15px;height:15px}
.ruler{position:relative;height:16px;margin:16px 0 2px;font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-faint)}
.ruler span{position:absolute;transform:translateX(-50%);top:0}
.ruler .tickline{position:absolute;top:13px;left:0;right:0;height:1px;background:var(--hair)}
.row{border-bottom:1px solid var(--hair);padding:14px 0;display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
.row.dim{opacity:.42}
.rowhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin-bottom:9px}
.fname{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:16px}
.params{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--ink-soft)}
.params b{font-weight:600;color:var(--ink)}
.strip{position:relative;height:26px;background:repeating-linear-gradient(90deg,var(--hair) 0 1px,transparent 1px 10%);border-left:1px solid var(--ink);border-right:1px solid var(--ink)}
.nullband{position:absolute;top:0;bottom:0;background:var(--null);opacity:.55}
.nullmean{position:absolute;top:0;bottom:0;width:1px;background:var(--ink-soft)}
.ci{position:absolute;top:7px;height:12px;background:var(--measure-soft);border-left:2px solid var(--measure);border-right:2px solid var(--measure);transform-origin:left center}
.ci.rej{border-color:var(--reject);background:#8C4A3222}
.point{position:absolute;top:4px;width:2px;height:18px;background:var(--measure)}
.point.rej{background:var(--reject)}
.striplabel{font-family:"IBM Plex Mono",monospace;font-size:10px;color:var(--ink-faint);margin-top:5px;display:flex;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--hair);border:1px solid var(--hair)}
.stat{background:var(--paper-2);padding:7px 8px}
.stat dt{font-family:"IBM Plex Mono",monospace;font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-faint);margin:0}
.stat dd{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;margin:2px 0 0}
.verdict{font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;padding:3px 7px;border:1px solid currentColor}
.v-pass{color:var(--measure)}
.v-fail{color:var(--reject)}
.v-thin{color:var(--ink-faint)}
.empty{border:1px solid var(--hair);background:var(--paper-2);padding:24px}
.empty h2{font-family:"Space Grotesk",sans-serif;font-size:19px;margin:0 0 8px}
.empty p{margin:0 0 14px;color:var(--ink-soft);font-size:14px;max-width:62ch}
pre{font-family:"IBM Plex Mono",monospace;font-size:12.5px;background:var(--paper);border:1px solid var(--hair);padding:12px;overflow-x:auto;margin:0 0 14px}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--hair);font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--ink-faint)}
@media (max-width:760px){.row{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){
.ci,.point{animation:draw .5s cubic-bezier(.2,.7,.3,1) both}
@keyframes draw{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}}
</style>
</head>
<body>
<div class="wrap">
<header class="mast">
<h1>Factor Lab</h1>
<div class="sub" id="subline">btc-eth-smc · parameter sweep vs block-shuffle null</div>
</header>
<div id="app"></div>
<footer>A factor passes only when its Wilson interval clears the 95th percentile of the shuffled-data null. Beating 50% is not evidence.</footer>
</div>
<script>
const RANGE=[0.30,0.75];
const pos=v=>Math.max(0,Math.min(1,(v-RANGE[0])/(RANGE[1]-RANGE[0])))*100;
const pct=v=>v==null?"—":(v*100).toFixed(1)+"%";
const num=v=>v==null?"—":(v>0?"+":"")+v.toFixed(2);
let DATA=null,sortKey="ci_low",hideFail=false,factorFilter="all";
function verdict(r){
if(r.trades<30)return{cls:"v-thin",text:"too few trades"};
if(r.null_p95==null)return{cls:"v-thin",text:"no null run"};
if(r.ci_low>r.null_p95)return{cls:"v-pass",text:"clears null"};
return{cls:"v-fail",text:"inside null"};}
function ruler(){
const t=[0.35,0.40,0.45,0.50,0.55,0.60,0.65,0.70];
return '<div class="ruler"><div class="tickline"></div>'+t.map(x=>'<span style="left:'+pos(x)+'%">'+(x*100).toFixed(0)+'</span>').join("")+'</div>';}
function row(r){
const v=verdict(r),fail=v.cls==="v-fail";
const nb=(r.null_p05!=null&&r.null_p95!=null)?'<div class="nullband" style="left:'+pos(r.null_p05)+'%;width:'+(pos(r.null_p95)-pos(r.null_p05))+'%"></div><div class="nullmean" style="left:'+pos(r.null_mean)+'%"></div>':"";
const params=Object.entries(r.params||{}).map(([k,val])=>k+'=<b>'+val+'</b>').join("  ");
return '<div class="row'+(fail?" dim":"")+'"><div><div class="rowhead"><span class="fname">'+r.factor+'</span><span class="verdict '+v.cls+'">'+v.text+'</span></div><div class="params">'+params+'</div><div class="strip" style="margin-top:9px">'+nb+'<div class="ci'+(fail?" rej":"")+'" style="left:'+pos(r.ci_low)+'%;width:'+Math.max(0.6,pos(r.ci_high)-pos(r.ci_low))+'%"></div><div class="point'+(fail?" rej":"")+'" style="left:'+pos(r.win_rate)+'%"></div></div><div class="striplabel"><span>CI '+pct(r.ci_low)+' – '+pct(r.ci_high)+'</span><span>null band '+pct(r.null_p05)+' – '+pct(r.null_p95)+'</span></div></div><dl class="stats"><div class="stat"><dt>trades</dt><dd>'+r.trades+'</dd></div><div class="stat"><dt>win rate</dt><dd>'+pct(r.win_rate)+'</dd></div><div class="stat"><dt>expectancy R</dt><dd>'+num(r.expectancy_r)+'</dd></div><div class="stat"><dt>avg R</dt><dd>'+num(r.avg_r)+'</dd></div><div class="stat"><dt>max DD R</dt><dd>'+num(r.max_dd_r)+'</dd></div><div class="stat"><dt>vs null pct</dt><dd>'+pct(r.percentile_vs_null)+'</dd></div></dl></div>';}
function conditions(run){
const fm=run.fee_bps_roundtrip==null;
const items=[["symbol",run.symbol],["timeframe",run.timeframe],["bars",run.bars],
["fee bps r/t",fm?"not set":run.fee_bps_roundtrip,fm],["fee mode",run.fee_mode||"unknown",!run.fee_mode],
["body threshold",run.body_threshold],["null iters",run.null_iterations]];
return '<dl class="conds">'+items.map(([k,val,warn])=>'<div class="cond'+(warn?" warn":"")+'"><dt>'+k+'</dt><dd>'+(val??"—")+'</dd></div>').join("")+'</dl><p class="note">Fee assumption changes which entry mode wins. Limit fills pay maker, confirmation entries pay taker — a sweep run with the wrong number compares the wrong things.</p>';}
function render(){
const app=document.getElementById("app");
if(!DATA)return;
const run=DATA.run||{};
document.getElementById("subline").textContent="btc-eth-smc · "+(run.symbol||"?")+" "+(run.timeframe||"")+" · generated "+(run.generated_at||"").replace("T"," ");
const factors=["all",...new Set(DATA.results.map(r=>r.factor))];
let rows=DATA.results.slice();
if(factorFilter!=="all")rows=rows.filter(r=>r.factor===factorFilter);
if(hideFail)rows=rows.filter(r=>verdict(r).cls==="v-pass");
rows.sort((a,b)=>(b[sortKey]??-99)-(a[sortKey]??-99));
app.innerHTML=conditions(run)+'<div class="controls"><label class="ctl">factor <select id="ff">'+factors.map(f=>'<option'+(f===factorFilter?" selected":"")+'>'+f+'</option>').join("")+'</select></label><label class="ctl">rank by <select id="sk"><option value="ci_low"'+(sortKey==="ci_low"?" selected":"")+'>lower CI bound</option><option value="expectancy_r"'+(sortKey==="expectancy_r"?" selected":"")+'>expectancy R</option><option value="percentile_vs_null"'+(sortKey==="percentile_vs_null"?" selected":"")+'>percentile vs null</option><option value="trades"'+(sortKey==="trades"?" selected":"")+'>trades</option><option value="win_rate"'+(sortKey==="win_rate"?" selected":"")+'>win rate</option></select></label><label class="switch ctl"><input type="checkbox" id="hf"'+(hideFail?" checked":"")+'> show only those clearing null</label><span class="ctl" style="margin-left:auto">'+rows.length+' of '+DATA.results.length+'</span></div>'+ruler()+(rows.length?rows.map(row).join(""):'<div class="empty"><h2>Nothing matches this filter</h2><p>Turn off the null filter to see rejected combinations — knowing what failed is the useful half.</p></div>');
document.getElementById("ff").onchange=e=>{factorFilter=e.target.value;render();};
document.getElementById("sk").onchange=e=>{sortKey=e.target.value;render();};
document.getElementById("hf").onchange=e=>{hideFail=e.target.checked;render();};}
function emptyState(){
document.getElementById("app").innerHTML='<div class="empty"><h2>No results file yet</h2><p>This page reads <code>data/factor_results.json</code>. Generate it on the RHEL box and commit the file.</p><pre>cd ~/btc-eth-smc\n~/venv/bin/python run_sweep.py --symbol BTCUSDT --tf 15m\ngit add data/factor_results.json\ngit commit -m "sweep: BTC 15m" &amp;&amp; git push</pre><button id="demo">Load sample data</button></div>';
document.getElementById("demo").onclick=()=>{DATA=SAMPLE;render();};}
const SAMPLE={run:{symbol:"BTCUSDT",timeframe:"15m",bars:24000,fee_bps_roundtrip:10,fee_mode:"taker",body_threshold:2.24,null_iterations:200,generated_at:"2026-08-09T00:40:00+00:00"},
results:[
{factor:"bos_body_close",params:{require_displacement:true,max_tests:1},trades:214,wins:126,win_rate:.5888,ci_low:.5219,ci_high:.6529,expectancy_r:.17,avg_r:.21,max_dd_r:-6.4,null_mean:.4981,null_p05:.4402,null_p95:.5140,null_n:200,percentile_vs_null:.995},
{factor:"bos_body_close",params:{require_displacement:false,max_tests:1},trades:612,wins:318,win_rate:.5196,ci_low:.4801,ci_high:.5589,expectancy_r:.03,avg_r:.04,max_dd_r:-11.2,null_mean:.5012,null_p05:.4610,null_p95:.5396,null_n:200,percentile_vs_null:.61},
{factor:"ob_first_test",params:{max_tests:1,body_dominance_cut:0.6},trades:96,wins:57,win_rate:.5938,ci_low:.4938,ci_high:.6862,expectancy_r:.19,avg_r:.24,max_dd_r:-5.1,null_mean:.5034,null_p05:.4271,null_p95:.5810,null_n:200,percentile_vs_null:.83},
{factor:"ob_any_test",params:{max_tests:null,body_dominance_cut:0.6},trades:341,wins:179,win_rate:.5249,ci_low:.4722,ci_high:.5770,expectancy_r:.05,avg_r:.06,max_dd_r:-8.8,null_mean:.5008,null_p05:.4499,null_p95:.5502,null_n:200,percentile_vs_null:.68},
{factor:"fvg_ote_entry",params:{entry_mode:"limit_ote",target_r:2.0},trades:158,wins:71,win_rate:.4494,ci_low:.3733,ci_high:.5278,expectancy_r:.09,avg_r:.12,max_dd_r:-7.3,null_mean:.4102,null_p05:.3388,null_p95:.4801,null_n:200,percentile_vs_null:.74},
{factor:"dragon_fruit",params:{entry_mode:"limit_mid",target_r:1.5,max_tests:1},trades:41,wins:27,win_rate:.6585,ci_low:.5079,ci_high:.7834,expectancy_r:.28,avg_r:.31,max_dd_r:-3.9,null_mean:.5021,null_p05:.3659,null_p95:.6341,null_n:200,percentile_vs_null:.91}]};
fetch("./data/factor_results.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject(r.status)).then(j=>{DATA=j;render();}).catch(()=>emptyState());
</script>
</body>
</html>
