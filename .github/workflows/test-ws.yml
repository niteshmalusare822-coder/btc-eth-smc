name: test-coindcx-websocket-and-audit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: 'cron: '30 9 * * *'  # दररोज दुपारी 2:30 PM IST (09:00 UTC)

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install "python-socketio==4.6.1" "python-engineio==3.14.2" websocket-client pandas numpy requests ccxt

      - name: Run test (auto-stop after 90s)
        run: timeout 90 python3 -u test_ws.py || true

      - name: Run Data Collection & Generate Latest Audit Report
        run: python3 collect.py --discover --bars 10000

      - name: Cost Breakdown Check
        run: python3 cost_breakdown.py

      - name: Commit and Push Updated Audit Report
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add AUDIT_ENHANCEMENTS.md
          git commit -m "Auto-update AUDIT_ENHANCEMENTS.md with latest research/pooled data [skip ci]" || exit 0
          git push
