name: test-coindcx-websocket-and-audit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '30 1 * * *'   # दररोज सकाळी 9:00 AM IST (03:30 UTC)

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install "python-socketio==4.6.1" "python-engineio==3.14.2" websocket-client pandas numpy requests ccxt

      - name: Run test (auto-stop after 90s)
        run: timeout 90 python3 -u test_ws.py || true

      - name: Run Data Collection & Generate Latest Audit Report
        run: python3 collect.py --symbols BTC,ETH,SOL,XRP,AVAX,LINK,DOGE,ADA,DEXE,BANK,BNB,SUI,HBAR,LTC,BCH,DOT,1000PEPE --bars 10000

      - name: Generate Missed Trade Audit (same day window as the audit report)
        continue-on-error: true
        run: python3 audit_missed.py --symbols BTC,ETH,SOL,XRP,AVAX,LINK,DOGE,ADA,DEXE,BANK,BNB,SUI,HBAR,LTC,BCH,DOT,1000PEPE --bars 10000 > /dev/null

      - name: Cost Breakdown Check
        run: python3 cost_breakdown.py

      - name: Commit and Push Updated Audit Reports
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add AUDIT_ENHANCEMENTS.md
          if [ -f MISSED_TRADE_AUDIT.md ]; then git add MISSED_TRADE_AUDIT.md; fi
          git commit -m "Auto-update AUDIT_ENHANCEMENTS.md and MISSED_TRADE_AUDIT.md [skip ci]" || exit 0
          git push
