name: test-coindcx-websocket

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install "python-socketio==4.6.1" "python-engineio==3.14.2" websocket-client

      - name: Run test (auto-stop after 90s)
        run: timeout 90 python3 test_ws.py || true
