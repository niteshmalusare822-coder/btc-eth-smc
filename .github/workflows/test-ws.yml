name: test-coindcx-websocket-and-audit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  schedule:
    - cron: '15 20 * * *'  # रोज रात्री 8:15 PM UTC (म्हणजेच रात्री 1:45 AM IST)
  workflow_dispatch:        # याच्यामुळे मॅन्युअली पण रन करता येईल

permissions:
  contents: write  # <<-- He add kelyane GitHub Action la write permission bhetel

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install "python-socketio==4.6.1" "python-engineio==3.14.2" websocket-client pandas numpy

      - name: Run test (auto-stop after 90s)
        run: timeout 90 python3 -u test_ws.py || true

      - name: Run Data Collection & Generate Latest Audit Report
        run: python3 collect.py || true

      - name: Commit and Push Updated Audit Report
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add AUDIT_ENHANCEMENTS.md
          git commit -m "Auto-update AUDIT_ENHANCEMENTS.md with latest research/pooled data [skip ci]" || exit 0
          git push
